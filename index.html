<style>
  body {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    min-height: 100vh;
  }

  h1 {
    color: red;
    text-align: center;
  }

  h5 {
  position: absolute;
  bottom: 10px;    
  left: 10px;  
  color: black;
}
  #testing {
    background-color: blue;
    color: white;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    margin-top: 20px;
    transition: 60s;
  }

  #testing:hover {
    background-color: blue;
    scale: 100;
  }
</style>

<h1>My Test Page</h1>
<h5>Ver 1.19</h5>
<button id="testing">Start Test</button>

<script>
  const StartTesting = document.getElementById("testing");
  StartTesting.addEventListener("click", function(){
      StartTesting.textContent = "testing completed!!";
  });
</script>
